name: Consigli del giorno

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Quanti giorni (1 = solo oggi)"
        default: "1"
  schedule:
    - cron: "30 6 * * *"   # ogni giorno alle 06:30 UTC (7:30 o 8:30 in Italia)
  push:
    branches: [main]       # ogni modifica agli script = nuovo deploy

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Genera consigli
        env:
          TZ: Europe/Rome
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DAYS: ${{ github.event.inputs.days || '1' }}
        run: python build_site.py --days "$DAYS"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
