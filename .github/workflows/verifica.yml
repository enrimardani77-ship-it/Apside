name: "Verifica fonti dell'Oracolo"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifica le fonti
        env:
          TZ: Europe/Rome
        run: |
          python verifica_fonti.py | tee verifica.txt
          {
            echo '## Verifica fonti'
            echo '```'
            cat verifica.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
